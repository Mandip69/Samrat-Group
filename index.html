<!doctype html>
<html lang="en">
  <head>
    <!-- ✅ Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Title (under 60 chars, keyword-rich) -->
    <title>Samrat Movie Pvt. Ltd | Nepali Movie Production & Entertainment</title>

    <!-- ✅ Meta Description (under 160 chars, compelling) -->
    <meta
      name="description"
      content="Samrat Movie Pvt. Ltd is Nepal’s trusted movie production & entertainment company. Explore Nepali films, latest projects & creative works."
    />

    <!-- ✅ Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <!-- ✅ Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="Samrat Movie Pvt. Ltd | Nepali Films & Entertainment" />
    <meta
      property="og:description"
      content="Official website of Samrat Movie Pvt. Ltd. Discover Nepali films, projects & creative entertainment work."
    />
    <meta property="og:image" content="https://samrat-movie.vercel.app/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samrat-movie.vercel.app/" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samrat Movie Pvt. Ltd | Nepali Films & Entertainment" />
    <meta
      name="twitter:description"
      content="Samrat Movie Pvt. Ltd – Leading movie production & entertainment company in Nepal."
    />
    <meta name="twitter:image" content="https://samrat-movie.vercel.app/logo.png" />

    <!-- ✅ Keywords (avoid stuffing, 8-10 max) -->
    <meta
      name="keywords"
      content="Samrat Movie, Nepali Films, Movie Production Nepal, Nepali Entertainment, Nepali Cinema, Film Studio Nepal, Movie Makers Nepal"
    />

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://samrat-movie.vercel.app/" />

    <!-- ✅ Language & Geo -->
    <meta name="language" content="English" />
    <meta name="geo.region" content="NP" />
    <meta name="geo.placename" content="Kathmandu, Nepal" />

    <!-- ✅ Robots -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- ✅ Schema.org JSON-LD (Organization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Samrat Movie Pvt. Ltd",
        "url": "https://samrat-movie.vercel.app/",
        "logo": "https://samrat-movie.vercel.app/logo.png",
        "sameAs": [
          "https://facebook.com/yourpage",
          "https://instagram.com/yourpage",
          "https://youtube.com/yourpage"
        ],
        "description": "Samrat Movie Pvt. Ltd is a movie production and entertainment company in Nepal."
      }
    </script>

    <!-- ✅ Schema.org JSON-LD (MovieProductionCompany) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MovieProductionCompany",
        "name": "Samrat Movie Pvt. Ltd",
        "url": "https://samrat-movie.vercel.app/",
        "logo": "https://samrat-movie.vercel.app/logo.png",
        "founder": "Your Name",
        "foundingDate": "2023",
        "telephone": "+977-XXXXXXXXXX",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Put actual street here",
          "addressLocality": "Kathmandu",
          "addressRegion": "Bagmati",
          "postalCode": "44600",
          "addressCountry": "NP"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+977-XXXXXXXXXX",
          "contactType": "customer service"
        },
        "description": "Nepali film production & entertainment company creating movies, documentaries & media projects."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
